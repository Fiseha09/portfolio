<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Fiseha's Portfolio...</title>
    <!-- Inter and Fira Code Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0B091A;
            --bg-card: rgba(30, 27, 75, 0.4);
            --neon-cyan: #06B6D4;
            --royal-gold: #F59E0B;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            /* Tech mesh matrix grid background */
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Ambient illumination */
        .glow-sphere {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        /* Matrix Particles */
        .matrix-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .matrix-node {
            position: absolute;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--neon-cyan);
            opacity: 0;
            animation: fallFade 4s infinite linear;
        }

        @keyframes fallFade {
            0% { transform: translateY(-5vh); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(105vh); opacity: 0; }
        }

        /* Main Container Card */
        .executive-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            width: 90%;
            max-width: 460px;
            text-align: center;
            z-index: 2;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* CEO / Owner Profile Brand Emblem */
        .avatar-portal {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--royal-gold));
            padding: 2px;
            position: relative;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #111026;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fira Code', monospace;
            font-size: 1.5rem;
            font-weight: 600;
            color: #FFF;
            letter-spacing: 1px;
        }

        /* Typography Hierarchy */
        .profile-name {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.25rem;
            background: linear-gradient(180deg, #FFFFFF 0%, #D1D5DB 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-title {
            font-size: 0.9rem;
            font-family: 'Fira Code', monospace;
            color: var(--royal-gold);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .company-affiliation {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .company-affiliation span {
            color: var(--neon-cyan);
            font-weight: 600;
        }

        /* Modernized Minimal Line Loader */
        .loader-shell {
            width: 80%;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            margin: 0 auto 1.5rem auto;
            position: relative;
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-core {
            width: 0%;
            height: 100%;
            background: var(--neon-cyan);
            position: absolute;
            left: 0;
            top: 0;
            box-shadow: 0 0 8px var(--neon-cyan);
            animation: executiveLoad 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes executiveLoad {
            0% { width: 0%; }
            50% { width: 60%; }
            100% { width: 100%; }
        }

        /* Live Terminal Logs */
        .terminal-log {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            height: 20px;
        }

        .terminal-log span {
            color: var(--royal-gold);
        }

        /* Fallback elements */
        .override-link {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: #4B5563;
        }

        .override-link a {
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px dotted var(--text-muted);
            transition: color 0.2s ease;
        }

        .override-link a:hover {
            color: var(--neon-cyan);
            border-bottom-color: var(--neon-cyan);
        }
    </style>
</head>
<body>

    <div class="glow-sphere"></div>
    <div class="matrix-container" id="matrix-canvas"></div>

    <div class="executive-card">
        
        <div class="avatar-portal">
            <div class="avatar-inner">
                <img src="images/fiseha-profile.jpg" alt="Fiseha Avatar" width="60" height="60" style="border-radius: 50%;">
            </div>
        </div>

        <h1 class="profile-name">Fiseha</h1>
        <div class="profile-title">Developer & Entrepreneur</div>
        <div class="company-affiliation">
            <img src="images/QineSystem-Logo.jpg" alt="Qine Systems Logo" width="20" height="20">
            <span>CEO</span> &bull; Owner of Qine Systems
        </div>

        <!-- Progress Tracking -->
        <div class="loader-shell">
            <div class="loader-core"></div>
        </div>

        <div class="terminal-log">
            Initializing secure runtime...
        </div>

        <div class="override-link">
            Bypassing animation? <a href="main.html">Request instant handoff</a>.
        </div>
    </div>

    <script>
        const destination = "main.html";

        // 1. Programmatically drop custom system codes down the matrix canvas
        const logElements = ['const owner = "Fiseha"', 'import { Qine } from "core"', 'status: 200', 'auth: true', 'CEO.init()', './main.sh'];
        const container = document.getElementById('matrix-canvas');
        
        for (let i = 0; i < 12; i++) {
            const div = document.createElement('div');
            div.className = 'matrix-node';
            div.textContent = logElements[Math.floor(Math.random() * logElements.length)];
            
            div.style.left = Math.random() * 95 + 'vw';
            div.style.animationDelay = Math.random() * 4 + 's';
            div.style.animationDuration = 3 + Math.random() * 3 + 's';
            
            if(Math.random() > 0.5) {
                div.style.color = '#F59E0B'; // Shift accents matching executive gold palette
            }
            
            container.appendChild(div);
        }

        // 2. Synchronize terminal activity readouts
        const logger = document.querySelector('.terminal-log');
        setTimeout(() => {
            logger.innerHTML = "Authenticating <span>Founder Signature...</span>";
        }, 1000);
        
        setTimeout(() => {
            logger.innerHTML = "Loading portfolio assets [<span>main.html</span>]...";
        }, 2000);

        // 3. Client redirect
        setTimeout(() => {
            window.location.href = destination;
        }, 3000);
    </script>
</body>
</html>
